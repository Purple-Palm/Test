<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Изометрическая визуализация систем автомобиля</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0e17;
    font-family: 'Segoe UI', system-ui, sans-serif;
    color: #e0e6f0;
    overflow: hidden;
    height: 100vh;
  }
  #app {
    display: flex;
    height: 100vh;
  }
  /* Side Panel */
  #panel {
    width: 320px;
    background: linear-gradient(180deg, #111827 0%, #0f172a 100%);
    border-right: 1px solid #1e293b;
    display: flex;
    flex-direction: column;
    z-index: 10;
    overflow-y: auto;
  }
  #panel h1 {
    font-size: 16px;
    padding: 20px 16px 8px;
    color: #94a3b8;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    font-weight: 600;
  }
  #panel h2 {
    font-size: 13px;
    padding: 14px 16px 6px;
    color: #64748b;
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: 500;
  }
  .system-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 16px;
    border: none;
    background: transparent;
    color: #cbd5e1;
    font-size: 13px;
    cursor: pointer;
    text-align: left;
    transition: all 0.2s;
    width: 100%;
  }
  .system-btn:hover {
    background: rgba(59,130,246,0.1);
    color: #fff;
  }
  .system-btn.active {
    background: rgba(59,130,246,0.15);
    color: #60a5fa;
    border-left: 3px solid #3b82f6;
  }
  .system-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .system-info {
    padding: 16px;
    background: rgba(30,41,59,0.5);
    margin: 8px 12px;
    border-radius: 8px;
    font-size: 12px;
    line-height: 1.6;
    color: #94a3b8;
    border: 1px solid #1e293b;
  }
  .system-info strong { color: #e2e8f0; }
  .stat-row {
    display: flex;
    justify-content: space-between;
    padding: 4px 0;
    border-bottom: 1px solid rgba(30,41,59,0.6);
  }
  .stat-row:last-child { border-bottom: none; }
  .stat-val { color: #60a5fa; font-weight: 600; }

  /* Canvas area */
  #canvas-wrap {
    flex: 1;
    position: relative;
    overflow: hidden;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
  /* Top bar */
  #topbar {
    position: absolute;
    top: 16px; left: 16px; right: 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    pointer-events: none;
    z-index: 5;
  }
  #topbar > * { pointer-events: all; }
  .controls {
    display: flex;
    gap: 8px;
  }
  .ctrl-btn {
    background: rgba(17,24,39,0.85);
    border: 1px solid #1e293b;
    color: #94a3b8;
    padding: 8px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    transition: all 0.2s;
    backdrop-filter: blur(8px);
  }
  .ctrl-btn:hover { background: rgba(30,41,59,0.9); color: #fff; }
  .ctrl-btn.active-ctrl { background: #1e40af; color: #fff; border-color: #3b82f6; }
  #rpm-display {
    background: rgba(17,24,39,0.85);
    border: 1px solid #1e293b;
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 13px;
    backdrop-filter: blur(8px);
    display: flex;
    gap: 20px;
  }
  .rpm-val { color: #60a5fa; font-weight: 700; font-size: 15px; }
  #tooltip {
    position: absolute;
    background: rgba(15,23,42,0.95);
    border: 1px solid #334155;
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 12px;
    pointer-events: none;
    display: none;
    z-index: 20;
    max-width: 200px;
    backdrop-filter: blur(8px);
  }
  /* Legend */
  #legend {
    position: absolute;
    bottom: 16px;
    left: 16px;
    background: rgba(17,24,39,0.85);
    border: 1px solid #1e293b;
    padding: 12px 16px;
    border-radius: 8px;
    font-size: 11px;
    backdrop-filter: blur(8px);
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    max-width: 600px;
  }
  .legend-item { display: flex; align-items: center; gap: 6px; color: #94a3b8; }
  .legend-color { width: 12px; height: 4px; border-radius: 2px; }
</style>
</head>
<body>
<div id="app">
  <div id="panel">
    <h1>Системы машины</h1>
    <h2>Силовая установка</h2>
    <button class="system-btn active" data-sys="engine" onclick="selectSystem('engine')">
      <span class="system-dot" style="background:#ef4444"></span>Двигатель (ДВС)
    </button>
    <button class="system-btn" data-sys="fuel" onclick="selectSystem('fuel')">
      <span class="system-dot" style="background:#f59e0b"></span>Топливная система
    </button>
    <button class="system-btn" data-sys="intake" onclick="selectSystem('intake')">
      <span class="system-dot" style="background:#a78bfa"></span>Впуск / Выпуск
    </button>
    <h2>Трансмиссия</h2>
    <button class="system-btn" data-sys="transmission" onclick="selectSystem('transmission')">
      <span class="system-dot" style="background:#3b82f6"></span>КПП
    </button>
    <button class="system-btn" data-sys="drivetrain" onclick="selectSystem('drivetrain')">
      <span class="system-dot" style="background:#6366f1"></span>Привод / Карданы
    </button>
    <h2>Шасси</h2>
    <button class="system-btn" data-sys="suspension" onclick="selectSystem('suspension')">
      <span class="system-dot" style="background:#10b981"></span>Подвеска
    </button>
    <button class="system-btn" data-sys="steering" onclick="selectSystem('steering')">
      <span class="system-dot" style="background:#14b8a6"></span>Рулевое управление
    </button>
    <button class="system-btn" data-sys="brakes" onclick="selectSystem('brakes')">
      <span class="system-dot" style="background:#f43f5e"></span>Тормозная система
    </button>
    <h2>Обеспечение</h2>
    <button class="system-btn" data-sys="cooling" onclick="selectSystem('cooling')">
      <span class="system-dot" style="background:#06b6d4"></span>Охлаждение
    </button>
    <button class="system-btn" data-sys="oil" onclick="selectSystem('oil')">
      <span class="system-dot" style="background:#d97706"></span>Смазка (масло)
    </button>
    <button class="system-btn" data-sys="electrical" onclick="selectSystem('electrical')">
      <span class="system-dot" style="background:#eab308"></span>Электрика
    </button>
    <button class="system-btn" data-sys="exhaust" onclick="selectSystem('exhaust')">
      <span class="system-dot" style="background:#78716c"></span>Выхлопная система
    </button>
    <h2>Кузов</h2>
    <button class="system-btn" data-sys="body" onclick="selectSystem('body')">
      <span class="system-dot" style="background:#64748b"></span>Кузов / Рама
    </button>
    <div id="sys-info" class="system-info"></div>
  </div>

  <div id="canvas-wrap">
    <canvas id="c"></canvas>
    <div id="topbar">
      <div class="controls">
        <button class="ctrl-btn" onclick="toggleAnim()">Пуск / Стоп</button>
        <button class="ctrl-btn" onclick="toggleExplode()">Разрез</button>
        <button class="ctrl-btn" onclick="toggleXray()">Рентген</button>
        <button class="ctrl-btn" onclick="resetView()">Сброс</button>
      </div>
      <div id="rpm-display">
        <span>RPM: <span class="rpm-val" id="rpm-val">0</span></span>
        <span>Скорость: <span class="rpm-val" id="speed-val">0</span> км/ч</span>
        <span>Темп.: <span class="rpm-val" id="temp-val">20</span>&deg;C</span>
      </div>
    </div>
    <div id="tooltip"></div>
    <div id="legend">
      <div class="legend-item"><span class="legend-color" style="background:#ef4444"></span>Двигатель</div>
      <div class="legend-item"><span class="legend-color" style="background:#3b82f6"></span>Трансмиссия</div>
      <div class="legend-item"><span class="legend-color" style="background:#10b981"></span>Подвеска</div>
      <div class="legend-item"><span class="legend-color" style="background:#06b6d4"></span>Охлаждение</div>
      <div class="legend-item"><span class="legend-color" style="background:#eab308"></span>Электрика</div>
      <div class="legend-item"><span class="legend-color" style="background:#f59e0b"></span>Топливо</div>
      <div class="legend-item"><span class="legend-color" style="background:#78716c"></span>Выхлоп</div>
    </div>
  </div>
</div>

<script>
// ========== CORE ENGINE ==========
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, cx, cy;
let time = 0;
let running = true;
let exploded = false;
let xray = false;
let selectedSystem = 'engine';
let rotAngle = 0.46;
let tiltAngle = 0.55;
let zoom = 1.0;
let dragStart = null;
let rpm = 0;
let targetRpm = 3200;
let engineTemp = 20;
let speed = 0;

function resize() {
  const r = window.devicePixelRatio || 1;
  W = canvas.parentElement.clientWidth;
  H = canvas.parentElement.clientHeight;
  canvas.width = W * r;
  canvas.height = H * r;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(r, 0, 0, r, 0, 0);
  cx = W / 2;
  cy = H / 2;
}
window.addEventListener('resize', resize);
resize();

// ========== ISOMETRIC TRANSFORM ==========
function iso(x, y, z) {
  const cosR = Math.cos(rotAngle), sinR = Math.sin(rotAngle);
  const cosT = Math.cos(tiltAngle), sinT = Math.sin(tiltAngle);
  let rx = x * cosR - y * sinR;
  let ry = x * sinR + y * cosR;
  let sx = rx * zoom;
  let sy = (ry * sinT - z * cosT) * zoom;
  return [cx + sx, cy + sy];
}

// ========== DRAWING HELPERS ==========
function setAlpha(color, a) {
  if (color.startsWith('#')) {
    let r = parseInt(color.slice(1,3),16);
    let g = parseInt(color.slice(3,5),16);
    let b = parseInt(color.slice(5,7),16);
    return `rgba(${r},${g},${b},${a})`;
  }
  return color;
}

function drawBox(x, y, z, w, h, d, color, sys, label) {
  const isActive = sys === selectedSystem;
  const alpha = xray ? (isActive ? 0.7 : 0.12) : (isActive ? 0.9 : 0.45);
  const eo = exploded ? getExplodeOffset(sys) : {x:0,y:0,z:0};
  const ex = x+eo.x, ey = y+eo.y, ez = z+eo.z;

  const p = [
    iso(ex, ey, ez),
    iso(ex+w, ey, ez),
    iso(ex+w, ey+h, ez),
    iso(ex, ey+h, ez),
    iso(ex, ey, ez+d),
    iso(ex+w, ey, ez+d),
    iso(ex+w, ey+h, ez+d),
    iso(ex, ey+h, ez+d)
  ];

  // Top face
  ctx.beginPath();
  ctx.moveTo(p[4][0],p[4][1]);
  ctx.lineTo(p[5][0],p[5][1]);
  ctx.lineTo(p[6][0],p[6][1]);
  ctx.lineTo(p[7][0],p[7][1]);
  ctx.closePath();
  ctx.fillStyle = setAlpha(color, alpha);
  ctx.fill();
  if (isActive) { ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.stroke(); }

  // Right face
  ctx.beginPath();
  ctx.moveTo(p[1][0],p[1][1]);
  ctx.lineTo(p[5][0],p[5][1]);
  ctx.lineTo(p[6][0],p[6][1]);
  ctx.lineTo(p[2][0],p[2][1]);
  ctx.closePath();
  ctx.fillStyle = setAlpha(color, alpha * 0.7);
  ctx.fill();
  if (isActive) ctx.stroke();

  // Front face
  ctx.beginPath();
  ctx.moveTo(p[2][0],p[2][1]);
  ctx.lineTo(p[6][0],p[6][1]);
  ctx.lineTo(p[7][0],p[7][1]);
  ctx.lineTo(p[3][0],p[3][1]);
  ctx.closePath();
  ctx.fillStyle = setAlpha(color, alpha * 0.5);
  ctx.fill();
  if (isActive) ctx.stroke();

  // Label
  if (isActive && label) {
    const cp = iso(ex+w/2, ey+h/2, ez+d+8);
    ctx.fillStyle = '#fff';
    ctx.font = '11px system-ui';
    ctx.textAlign = 'center';
    ctx.fillText(label, cp[0], cp[1]);
  }
}

function drawCylinder(x, y, z, r, h, color, sys, label, segments) {
  const isActive = sys === selectedSystem;
  const alpha = xray ? (isActive ? 0.65 : 0.1) : (isActive ? 0.85 : 0.4);
  const eo = exploded ? getExplodeOffset(sys) : {x:0,y:0,z:0};
  const ex = x+eo.x, ey = y+eo.y, ez = z+eo.z;
  segments = segments || 16;

  // Body
  ctx.beginPath();
  for (let i = 0; i <= segments; i++) {
    const a = (i / segments) * Math.PI * 2;
    const px = ex + Math.cos(a) * r;
    const py = ey + Math.sin(a) * r;
    const pt = iso(px, py, ez);
    if (i === 0) ctx.moveTo(pt[0], pt[1]);
    else ctx.lineTo(pt[0], pt[1]);
  }
  for (let i = segments; i >= 0; i--) {
    const a = (i / segments) * Math.PI * 2;
    const px = ex + Math.cos(a) * r;
    const py = ey + Math.sin(a) * r;
    const pt = iso(px, py, ez + h);
    ctx.lineTo(pt[0], pt[1]);
  }
  ctx.closePath();
  ctx.fillStyle = setAlpha(color, alpha * 0.6);
  ctx.fill();
  if (isActive) { ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.stroke(); }

  // Top ellipse
  ctx.beginPath();
  for (let i = 0; i <= segments; i++) {
    const a = (i / segments) * Math.PI * 2;
    const px = ex + Math.cos(a) * r;
    const py = ey + Math.sin(a) * r;
    const pt = iso(px, py, ez + h);
    if (i === 0) ctx.moveTo(pt[0], pt[1]);
    else ctx.lineTo(pt[0], pt[1]);
  }
  ctx.closePath();
  ctx.fillStyle = setAlpha(color, alpha);
  ctx.fill();
  if (isActive) ctx.stroke();

  if (isActive && label) {
    const cp = iso(ex, ey, ez + h + 10);
    ctx.fillStyle = '#fff';
    ctx.font = '10px system-ui';
    ctx.textAlign = 'center';
    ctx.fillText(label, cp[0], cp[1]);
  }
}

function drawLine(x1,y1,z1, x2,y2,z2, color, sys, width) {
  const isActive = sys === selectedSystem;
  const alpha = xray ? (isActive ? 0.8 : 0.08) : (isActive ? 0.9 : 0.3);
  const eo = exploded ? getExplodeOffset(sys) : {x:0,y:0,z:0};
  const p1 = iso(x1+eo.x, y1+eo.y, z1+eo.z);
  const p2 = iso(x2+eo.x, y2+eo.y, z2+eo.z);
  ctx.beginPath();
  ctx.moveTo(p1[0], p1[1]);
  ctx.lineTo(p2[0], p2[1]);
  ctx.strokeStyle = setAlpha(color, alpha);
  ctx.lineWidth = (width||2) * (isActive ? 1.5 : 1);
  ctx.stroke();
}

function drawPipe(points, color, sys, width) {
  const isActive = sys === selectedSystem;
  const alpha = xray ? (isActive ? 0.8 : 0.08) : (isActive ? 0.9 : 0.3);
  const eo = exploded ? getExplodeOffset(sys) : {x:0,y:0,z:0};
  if (points.length < 2) return;
  ctx.beginPath();
  const p0 = iso(points[0][0]+eo.x, points[0][1]+eo.y, points[0][2]+eo.z);
  ctx.moveTo(p0[0], p0[1]);
  for (let i = 1; i < points.length; i++) {
    const p = iso(points[i][0]+eo.x, points[i][1]+eo.y, points[i][2]+eo.z);
    ctx.lineTo(p[0], p[1]);
  }
  ctx.strokeStyle = setAlpha(color, alpha);
  ctx.lineWidth = (width||3) * (isActive ? 1.8 : 1);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.stroke();

  // Animated flow dots
  if (isActive && running) {
    const totalLen = points.length - 1;
    for (let d = 0; d < 3; d++) {
      const t = ((time * 2 + d * 0.33) % 1);
      const idx = Math.floor(t * totalLen);
      const frac = t * totalLen - idx;
      if (idx < totalLen) {
        const pa = iso(
          points[idx][0]+eo.x + (points[idx+1][0]-points[idx][0])*frac,
          points[idx][1]+eo.y + (points[idx+1][1]-points[idx][1])*frac,
          points[idx][2]+eo.z + (points[idx+1][2]-points[idx][2])*frac
        );
        ctx.beginPath();
        ctx.arc(pa[0], pa[1], 3, 0, Math.PI*2);
        ctx.fillStyle = setAlpha(color, 0.95);
        ctx.fill();
      }
    }
  }
}

function drawWheel(x, y, z, radius, sys) {
  const isActive = sys === selectedSystem;
  const alpha = xray ? (isActive ? 0.7 : 0.1) : (isActive ? 0.85 : 0.5);
  const eo = exploded ? getExplodeOffset(sys) : {x:0,y:0,z:0};
  const ex = x+eo.x, ey = y+eo.y, ez = z+eo.z;

  // Tire outer
  const segs = 20;
  ctx.beginPath();
  for (let i = 0; i <= segs; i++) {
    const a = (i/segs) * Math.PI * 2 + (running ? time * 3 : 0);
    const px = ex + Math.cos(a)*radius;
    const pz = ez + Math.sin(a)*radius;
    const pt = iso(px, ey, pz);
    if (i===0) ctx.moveTo(pt[0],pt[1]);
    else ctx.lineTo(pt[0],pt[1]);
  }
  ctx.closePath();
  ctx.fillStyle = setAlpha('#1e1e2e', alpha);
  ctx.fill();
  ctx.strokeStyle = setAlpha('#374151', alpha);
  ctx.lineWidth = isActive ? 2 : 1;
  ctx.stroke();

  // Hub
  ctx.beginPath();
  for (let i = 0; i <= segs; i++) {
    const a = (i/segs) * Math.PI * 2;
    const px = ex + Math.cos(a)*radius*0.4;
    const pz = ez + Math.sin(a)*radius*0.4;
    const pt = iso(px, ey, pz);
    if (i===0) ctx.moveTo(pt[0],pt[1]);
    else ctx.lineTo(pt[0],pt[1]);
  }
  ctx.closePath();
  ctx.fillStyle = setAlpha('#4b5563', alpha);
  ctx.fill();

  // Spokes
  const spokeAngle = running ? time * 5 : 0;
  for (let i = 0; i < 5; i++) {
    const a = spokeAngle + (i/5) * Math.PI * 2;
    const inner = iso(ex + Math.cos(a)*radius*0.15, ey, ez + Math.sin(a)*radius*0.15);
    const outer = iso(ex + Math.cos(a)*radius*0.75, ey, ez + Math.sin(a)*radius*0.75);
    ctx.beginPath();
    ctx.moveTo(inner[0], inner[1]);
    ctx.lineTo(outer[0], outer[1]);
    ctx.strokeStyle = setAlpha('#9ca3af', alpha);
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  // Brake disc (inside wheel)
  if (sys === 'brakes' || selectedSystem === 'brakes') {
    ctx.beginPath();
    for (let i = 0; i <= segs; i++) {
      const a = (i/segs) * Math.PI * 2;
      const px = ex + Math.cos(a)*radius*0.55;
      const pz = ez + Math.sin(a)*radius*0.55;
      const pt = iso(px, ey - 2, pz);
      if (i===0) ctx.moveTo(pt[0],pt[1]);
      else ctx.lineTo(pt[0],pt[1]);
    }
    ctx.closePath();
    const brakeAlpha = selectedSystem === 'brakes' ? 0.6 : 0.2;
    ctx.fillStyle = `rgba(244,63,94,${brakeAlpha})`;
    ctx.fill();

    // Brake caliper
    const calP = iso(ex + radius*0.45, ey - 4, ez);
    ctx.beginPath();
    ctx.arc(calP[0], calP[1], 6, 0, Math.PI*2);
    ctx.fillStyle = `rgba(244,63,94,${brakeAlpha + 0.2})`;
    ctx.fill();
  }
}

// ========== EXPLODE OFFSETS ==========
function getExplodeOffset(sys) {
  const d = 80;
  const offsets = {
    engine: {x:0, y:0, z: d*0.7},
    fuel: {x: -d, y: d*0.5, z: 0},
    intake: {x: 0, y: -d*0.6, z: d*0.5},
    transmission: {x: d*0.5, y: 0, z: 0},
    drivetrain: {x: d*0.3, y: 0, z: -d*0.5},
    suspension: {x: 0, y: 0, z: -d},
    steering: {x: -d*0.6, y: -d*0.5, z: 0},
    brakes: {x: 0, y: d*0.8, z: -d*0.3},
    cooling: {x: -d, y: 0, z: d*0.3},
    oil: {x: d*0.3, y: d*0.3, z: d*0.5},
    electrical: {x: 0, y: -d, z: d*0.8},
    exhaust: {x: d, y: d*0.5, z: -d*0.4},
    body: {x: 0, y: 0, z: d*1.3}
  };
  return offsets[sys] || {x:0,y:0,z:0};
}

// ========== SYSTEM INFO ==========
const systemInfo = {
  engine: {
    name: 'Двигатель внутреннего сгорания',
    desc: 'Рядный 4-цилиндровый, 2.0L турбо',
    stats: [
      ['Мощность', '250 л.с.'],
      ['Крутящий момент', '350 Нм'],
      ['Степень сжатия', '10.5:1'],
      ['Порядок работы', '1-3-4-2'],
      ['Макс. обороты', '7000 об/мин'],
      ['Тип ГРМ', 'DOHC 16V']
    ]
  },
  fuel: {
    name: 'Топливная система',
    desc: 'Прямой впрыск, электронное управление',
    stats: [
      ['Давление рампы', '200 бар'],
      ['Форсунки', '4 пьезо'],

function selectSystem(sys) {
  selectedSystem = sys;
  document.querySelectorAll('.system-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.sys === sys);
  });
  const info = systemInfo[sys];
  if (info) {
    let html = `<strong>${info.name}</strong><br><span style="color:#60a5fa">${info.desc}</span><br><br>`;
    info.stats.forEach(s => {
      html += `<div class="stat-row"><span>${s[0]}</span><span class="stat-val">${s[1]}</span></div>`;
    });
    document.getElementById('sys-info').innerHTML = html;
  }
}

function drawGrid() {
  ctx.globalAlpha = 0.08;
  const step = 40, count = 12;
  for (let i = -count; i <= count; i++) {
    const p1 = iso(i*step, -count*step, 0);
    const p2 = iso(i*step, count*step, 0);
    ctx.beginPath(); ctx.moveTo(p1[0],p1[1]); ctx.lineTo(p2[0],p2[1]);
    ctx.strokeStyle = '#3b82f6'; ctx.lineWidth = 0.5; ctx.stroke();
    const p3 = iso(-count*step, i*step, 0);
    const p4 = iso(count*step, i*step, 0);
    ctx.beginPath(); ctx.moveTo(p3[0],p3[1]); ctx.lineTo(p4[0],p4[1]);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

function drawEngine() {
  const t = time;
  // Engine block
  drawBox(-140, -30, 10, 60, 60, 45, '#ef4444', 'engine', 'Блок цилиндров');
  // Cylinder head
  drawBox(-138, -28, 55, 56, 56, 15, '#dc2626', 'engine', 'ГБЦ');
  // Valve cover
  drawBox(-136, -26, 70, 52, 52, 8, '#b91c1c', 'engine', 'Крышка клапанов');

  // 4 Cylinders (pistons moving)
  for (let i = 0; i < 4; i++) {
    const phase = (t * 4 + i * 0.25) % 1;
    const pistonZ = 15 + Math.sin(phase * Math.PI * 2) * 10;
    const cx = -132 + i * 13;
    drawCylinder(cx, 0, pistonZ, 5, 18, '#fca5a5', 'engine', i === 0 ? 'Поршни' : '', 10);
  }

  // Crankshaft
  const crankRot = t * 6;
  for (let i = 0; i < 5; i++) {
    drawCylinder(-135 + i*12, 0, 10 + Math.sin(crankRot + i)*2, 3, 3, '#fbbf24', 'engine', i===2?'Коленвал':'', 8);
  }
  drawLine(-135, 0, 12, -85, 0, 12, '#fbbf24', 'engine', 2);

  // Timing belt
  drawLine(-136, -26, 65, -136, -26, 15, '#9ca3af', 'engine', 1);

  // Oil pan
  drawBox(-142, -32, 3, 64, 64, 8, '#d97706', 'oil', 'Масляный поддон');

  // Turbocharger
  const turboSpin = running ? t * 15 : 0;
  drawCylinder(-145, 30, 35, 12, 15, '#a78bfa', 'intake', 'Турбокомпрессор', 12);
  // Turbine blades (animated)
  for (let i = 0; i < 6; i++) {
    const a = turboSpin + (i/6)*Math.PI*2;
    const eo = exploded ? getExplodeOffset('intake') : {x:0,y:0,z:0};
    const p1 = iso(-145+eo.x, 30+eo.y, 42+eo.z);
    const p2 = iso(-145+Math.cos(a)*10+eo.x, 30+Math.sin(a)*10+eo.y, 42+eo.z);
    ctx.beginPath(); ctx.moveTo(p1[0],p1[1]); ctx.lineTo(p2[0],p2[1]);
    ctx.strokeStyle = selectedSystem==='intake' ? 'rgba(167,139,250,0.9)' : 'rgba(167,139,250,0.3)';
    ctx.lineWidth = 2; ctx.stroke();
  }
}

  drawBox(-30, -55, 28, 18, 14, 8, '#a16207', 'electrical', 'ЭБУ (ECU)');
  // Fuse box
  drawBox(-20, 50, 25, 15, 12, 8, '#eab308', 'electrical', 'Блок предохранителей');
  // CAN bus wires
  drawPipe([
    [-30, -48, 32],
    [-50, -40, 30],
    [-82, -35, 32]
  ], '#fde047', 'electrical', 1.5);
  drawPipe([
    [-30, -48, 32],
    [0, -45, 30],
    [40, -42, 28],
    [100, -40, 25]
  ], '#fde047', 'electrical', 1.5);
  drawPipe([
    [-30, -48, 32],
    [-30, 0, 30],
    [-20, 50, 27]
  ], '#fde047', 'electrical', 1.5);
  // Sensor points (animated blinking)
  const blink = Math.sin(time * 6) > 0;
  if (selectedSystem === 'electrical' && blink) {
    const sensors = [
      [-130, 0, 50, 'Датч. детонации'],
      [-140, 35, 50, 'MAF'],
      [-80, 0, 8, 'ABS датчик'],
      [130, 0, 8, 'ABS датчик'],
      [-135, -10, 35, 'Темп. ОЖ'],
      [-125, 20, 12, 'Давл. масла'],
      [-130, 25, 62, 'Лямбда-зонд']
    ];
    sensors.forEach(s => {
      const eo = exploded ? getExplodeOffset('electrical') : {x:0,y:0,z:0};
      const p = iso(s[0]+eo.x, s[1]+eo.y, s[2]+eo.z);
      ctx.beginPath();
      ctx.arc(p[0], p[1], 4, 0, Math.PI*2);
      ctx.fillStyle = 'rgba(234,179,8,0.9)';
      ctx.fill();
      ctx.fillStyle = '#fff'; ctx.font = '8px system-ui'; ctx.textAlign = 'center';
      ctx.fillText(s[3], p[0], p[1]-8);
    });
  }
}

function drawExhaust() {
  // Exhaust manifold
  for (let i = 0; i < 4; i++) {
    drawPipe([
      [-130 + i*12, 30, 20],
      [-130 + i*12, 38, 18],
      [-115, 42, 15]
    ], '#78716c', 'exhaust', 2);
  }
  // Turbo (exhaust side)
  drawCylinder(-115, 42, 12, 8, 10, '#57534e', 'exhaust', 'Турбина (выхлоп)', 8);
  // Downpipe
  drawPipe([
    [-115, 42, 12],
    [-100, 45, 10],
    [-70, 45, 8],
    [-40, 42, 6]
  ], '#78716c', 'exhaust', 3);
  // Catalytic converter
  drawBox(-45, 38, 2, 20, 14, 10, '#a8a29e', 'exhaust', 'Катализатор');
  // GPF
  drawBox(-20, 38, 2, 15, 12, 10, '#d6d3d1', 'exhaust', 'GPF (сажевый)');
  // Mid pipe
  drawPipe([
    [-5, 44, 6],
    [30, 44, 5],
    [60, 42, 4]
  ], '#78716c', 'exhaust', 3);
  // Resonator
  drawBox(55, 38, 1, 22, 14, 8, '#57534e', 'exhaust', 'Резонатор');
  // Rear muffler
  drawBox(90, 36, 0, 35, 18, 12, '#44403c', 'exhaust', 'Глушитель');
  // Exhaust tips
  drawCylinder(127, 40, 4, 3, 8, '#a8a29e', 'exhaust', '', 8);
  drawCylinder(127, 48, 4, 3, 8, '#a8a29e', 'exhaust', 'Выхлопные патрубки', 8);
  // Sport valve
  drawCylinder(88, 45, 5, 3, 5, '#fbbf24', 'exhaust', 'Клапан (спорт)', 6);
  // Lambda sensors
  drawCylinder(-42, 38, 10, 2, 4, '#eab308', 'exhaust', 'Лямбда 1', 6);
  drawCylinder(-5, 38, 10, 2, 4, '#eab308', 'exhaust', 'Лямбда 2', 6);

  // Exhaust gas particles (animated)
  if (running && (selectedSystem === 'exhaust' || !xray)) {
    for (let i = 0; i < 5; i++) {
      const t2 = (time * 2 + i * 0.2) % 1;
      const eo = exploded ? getExplodeOffset('exhaust') : {x:0,y:0,z:0};
      const p = iso(130 + t2*20 + eo.x, 44 + Math.sin(t2*5)*3 + eo.y, 6 + t2*8 + eo.z);
      ctx.beginPath();
      ctx.arc(p[0], p[1], 2 - t2, 0, Math.PI*2);
      ctx.fillStyle = `rgba(120,113,108,${0.6-t2*0.5})`;
      ctx.fill();
    }
  }
}

function drawWheels() {
  const bounce = running ? Math.sin(time * 3) * 2 : 0;
  drawWheel(-80, -80, 18+bounce, 18, 'brakes');
  drawWheel(-80, 80, 18+bounce, 18, 'brakes');
  drawWheel(130, -80, 18-bounce, 18, 'brakes');
  drawWheel(130, 80, 18-bounce, 18, 'brakes');
}

function drawIntakeSystem() {
  // Air filter box
  drawBox(-160, -45, 40, 18, 20, 12, '#a78bfa', 'intake', 'Воздушный фильтр');
  // Intake pipe to turbo
  drawPipe([
    [-142, -35, 46],
    [-148, -20, 44],
    [-148, 10, 42],
    [-145, 25, 40]
  ], '#a78bfa', 'intake', 3);
  // Intercooler
  drawBox(-160, -55, 20, 8, 40, 14, '#8b5cf6', 'intake', 'Интеркулер');
  // Charge pipe from turbo
  drawPipe([
    [-145, 30, 48],
    [-155, 20, 38],
    [-160, -10, 30],
    [-160, -35, 27]
  ], '#c4b5fd', 'intake', 2.5);
  // Throttle body
  drawCylinder(-145, -10, 58, 5, 6, '#7c3aed', 'intake', 'Дроссельная заслонка', 8);
  // Intake manifold
  drawBox(-140, -22, 56, 5, 44, 8, '#8b5cf6', 'intake', 'Впускной коллектор');
  // Intake runners
  for (let i = 0; i < 4; i++) {
    drawPipe([
      [-140, -15 + i*10, 60],
      [-136, -15 + i*10, 58]
    ], '#a78bfa', 'intake', 2);
  }
  // Blow-off valve
  drawCylinder(-150, 15, 44, 3, 5, '#6d28d9', 'intake', 'Blow-off клапан', 6);
  // Wastegate
  drawCylinder(-148, 35, 42, 3, 5, '#5b21b6', 'intake', 'Вейстгейт', 6);
}

// ========== ANIMATION & HUD ==========
function updateSimulation(dt) {
  if (running) {
    rpm += (targetRpm - rpm) * 0.02;
    engineTemp += (92 - engineTemp) * 0.005;
    speed += (120 - speed) * 0.01;
  } else {
    rpm *= 0.98;
    engineTemp += (20 - engineTemp) * 0.002;
    speed *= 0.97;
  }
  document.getElementById('rpm-val').textContent = Math.round(rpm);
  document.getElementById('speed-val').textContent = Math.round(speed);
  document.getElementById('temp-val').textContent = Math.round(engineTemp);
}

function drawShadow() {
  // Ground shadow
  const center = iso(0, 0, 0);
  ctx.beginPath();
  const s1 = iso(-160, -80, -2);
  const s2 = iso(160, -80, -2);
  const s3 = iso(160, 80, -2);
  const s4 = iso(-160, 80, -2);
  ctx.moveTo(s1[0],s1[1]); ctx.lineTo(s2[0],s2[1]);
  ctx.lineTo(s3[0],s3[1]); ctx.lineTo(s4[0],s4[1]);
  ctx.closePath();
  const grd = ctx.createRadialGradient(center[0],center[1],10,center[0],center[1],300);
  grd.addColorStop(0, 'rgba(0,0,0,0.3)');
  grd.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = grd;
  ctx.fill();
}

function drawGlowEffect() {
  // Glow around active system elements
  if (selectedSystem === 'engine' && running) {
    const eo = exploded ? getExplodeOffset('engine') : {x:0,y:0,z:0};
    const p = iso(-110+eo.x, 0+eo.y, 40+eo.z);
    const grd = ctx.createRadialGradient(p[0],p[1],5,p[0],p[1],40);
    grd.addColorStop(0, 'rgba(239,68,68,0.15)');
    grd.addColorStop(1, 'rgba(239,68,68,0)');
    ctx.fillStyle = grd;
    ctx.fillRect(p[0]-50, p[1]-50, 100, 100);
  }
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  // Background gradient
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#0a0e17');
  bg.addColorStop(1, '#111827');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  drawGrid();
  drawShadow();

  // Draw systems in depth order (back to front)
  drawBody();
  drawFuelSystem();
  drawExhaust();
  drawDrivetrain();
  drawOilSystem();
  drawCooling();
  drawEngine();
  drawIntakeSystem();
  drawTransmission();
  drawSuspension();
  drawSteering();
  drawBrakes();
  drawElectrical();
  drawWheels();
  drawGlowEffect();
}

function loop(ts) {
  const dt = 0.016;
  time += dt;
  updateSimulation(dt);
  draw();
  requestAnimationFrame(loop);
}

// ========== CONTROLS ==========
function toggleAnim() { running = !running; targetRpm = running ? 3200 : 0; }
function toggleExplode() { exploded = !exploded; }
function toggleXray() { xray = !xray; }
function resetView() {
  rotAngle = 0.46; tiltAngle = 0.55; zoom = 1.0;
  exploded = false; xray = false;
}

// Mouse rotation
canvas.addEventListener('mousedown', e => { dragStart = {x:e.clientX, y:e.clientY, rot:rotAngle, tilt:tiltAngle}; });
window.addEventListener('mousemove', e => {
  if (!dragStart) return;
  rotAngle = dragStart.rot + (e.clientX - dragStart.x) * 0.005;
  tiltAngle = Math.max(0.2, Math.min(1.2, dragStart.tilt + (e.clientY - dragStart.y) * 0.005));
});
window.addEventListener('mouseup', () => { dragStart = null; });

// Zoom
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  zoom = Math.max(0.3, Math.min(3, zoom - e.deltaY * 0.001));
}, {passive: false});

// Touch controls
let touchStart = null;
canvas.addEventListener('touchstart', e => {
  if (e.touches.length === 1) {
    const t = e.touches[0];
    touchStart = {x:t.clientX, y:t.clientY, rot:rotAngle, tilt:tiltAngle};
  }
});
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (touchStart && e.touches.length === 1) {
    const t = e.touches[0];
    rotAngle = touchStart.rot + (t.clientX - touchStart.x) * 0.005;
    tiltAngle = Math.max(0.2, Math.min(1.2, touchStart.tilt + (t.clientY - touchStart.y) * 0.005));
  }
}, {passive: false});
canvas.addEventListener('touchend', () => { touchStart = null; });

// Init
selectSystem('engine');
requestAnimationFrame(loop);
</script>
