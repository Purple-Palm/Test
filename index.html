<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Изометрическая визуализация систем автомобиля</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#080c14;font-family:'Segoe UI',system-ui,sans-serif;color:#e0e6f0;overflow:hidden;height:100vh}
#app{display:flex;height:100vh}
#panel{width:310px;background:linear-gradient(180deg,#0f1520 0%,#0a0f1a 100%);border-right:1px solid #1a2235;display:flex;flex-direction:column;z-index:10;overflow-y:auto;scrollbar-width:thin}
#panel::-webkit-scrollbar{width:4px}
#panel::-webkit-scrollbar-thumb{background:#1e293b;border-radius:2px}
#panel h1{font-size:14px;padding:18px 16px 6px;color:#64748b;text-transform:uppercase;letter-spacing:2px;font-weight:600}
#panel h2{font-size:11px;padding:14px 16px 4px;color:#475569;text-transform:uppercase;letter-spacing:1.2px;font-weight:500}
.sbtn{display:flex;align-items:center;gap:10px;padding:9px 16px;border:none;background:transparent;color:#94a3b8;font-size:13px;cursor:pointer;text-align:left;transition:all .15s;width:100%}
.sbtn:hover{background:rgba(99,102,241,.08);color:#c7d2fe}
.sbtn.act{background:rgba(99,102,241,.12);color:#a5b4fc;border-left:3px solid #6366f1;padding-left:13px}
.sdot{width:8px;height:8px;border-radius:50%;flex-shrink:0;box-shadow:0 0 6px currentColor}
.sinfo{padding:14px;background:rgba(15,21,32,.8);margin:8px 12px;border-radius:8px;font-size:12px;line-height:1.7;color:#94a3b8;border:1px solid #1a2235}
.sinfo strong{color:#e2e8f0;font-size:13px}
.sinfo .desc{color:#818cf8;margin-bottom:8px}
.sr{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid rgba(30,41,59,.4)}
.sr:last-child{border:none}
.sv{color:#a5b4fc;font-weight:600;font-size:11px}
#cw{flex:1;position:relative;overflow:hidden}
canvas{display:block}
#top{position:absolute;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:center;pointer-events:none;z-index:5}
#top>*{pointer-events:all}
.ctrls{display:flex;gap:6px}
.cb{background:rgba(15,20,30,.9);border:1px solid #1e293b;color:#94a3b8;padding:7px 14px;border-radius:6px;cursor:pointer;font-size:12px;transition:all .15s;backdrop-filter:blur(10px)}
.cb:hover{background:rgba(30,40,60,.9);color:#e2e8f0;border-color:#334155}
.cb.on{background:rgba(99,102,241,.3);color:#c7d2fe;border-color:#6366f1}
#hud{background:rgba(15,20,30,.9);border:1px solid #1e293b;padding:8px 16px;border-radius:8px;font-size:12px;backdrop-filter:blur(10px);display:flex;gap:18px;color:#64748b}
.hv{color:#a5b4fc;font-weight:700;font-size:14px}
#tip{position:absolute;background:rgba(10,15,25,.95);border:1px solid #334155;padding:8px 12px;border-radius:6px;font-size:11px;pointer-events:none;display:none;z-index:20;max-width:220px;backdrop-filter:blur(10px);color:#c7d2fe}
</style>
</head>
<body>
<div id="app">
<div id="panel">
  <h1>Системы</h1>
  <h2>Силовая установка</h2>
  <button class="sbtn act" data-s="engine" onclick="sel('engine')"><span class="sdot" style="color:#ef4444"></span>Двигатель</button>
  <button class="sbtn" data-s="fuel" onclick="sel('fuel')"><span class="sdot" style="color:#f59e0b"></span>Топливная</button>
  <button class="sbtn" data-s="intake" onclick="sel('intake')"><span class="sdot" style="color:#a78bfa"></span>Впуск / Наддув</button>
  <h2>Трансмиссия</h2>
  <button class="sbtn" data-s="trans" onclick="sel('trans')"><span class="sdot" style="color:#3b82f6"></span>КПП</button>
  <button class="sbtn" data-s="drive" onclick="sel('drive')"><span class="sdot" style="color:#6366f1"></span>Привод AWD</button>
  <h2>Шасси</h2>
  <button class="sbtn" data-s="susp" onclick="sel('susp')"><span class="sdot" style="color:#10b981"></span>Подвеска</button>
  <button class="sbtn" data-s="steer" onclick="sel('steer')"><span class="sdot" style="color:#14b8a6"></span>Рулевое</button>
  <button class="sbtn" data-s="brake" onclick="sel('brake')"><span class="sdot" style="color:#f43f5e"></span>Тормоза</button>
  <h2>Обеспечение</h2>
  <button class="sbtn" data-s="cool" onclick="sel('cool')"><span class="sdot" style="color:#06b6d4"></span>Охлаждение</button>
  <button class="sbtn" data-s="oil" onclick="sel('oil')"><span class="sdot" style="color:#d97706"></span>Смазка</button>
  <button class="sbtn" data-s="elec" onclick="sel('elec')"><span class="sdot" style="color:#eab308"></span>Электрика</button>
  <button class="sbtn" data-s="exh" onclick="sel('exh')"><span class="sdot" style="color:#78716c"></span>Выхлоп</button>
  <button class="sbtn" data-s="body" onclick="sel('body')"><span class="sdot" style="color:#475569"></span>Кузов</button>
  <div id="si" class="sinfo"></div>
</div>
<div id="cw">
  <canvas id="c"></canvas>
  <div id="top">
    <div class="ctrls">
      <button class="cb on" id="btnRun" onclick="togRun()">&#9654; Двигатель</button>
      <button class="cb" id="btnExp" onclick="togExp()">&#9878; Разрез</button>
      <button class="cb" id="btnXr" onclick="togXr()">&#9783; Рентген</button>
      <button class="cb" onclick="reset()">&#8634; Сброс</button>
    </div>
    <div id="hud">
      <span>RPM <span class="hv" id="vRpm">0</span></span>
      <span>Скор. <span class="hv" id="vSpd">0</span><small>км/ч</small></span>
      <span>T&deg; <span class="hv" id="vTmp">20</span></span>
    </div>
  </div>
</div>
</div>
<script>
// ============ RENDERER CORE ============
const C=document.getElementById('c'),X=C.getContext('2d');
let W,H,mx,my,t=0,run=1,expl=0,xray=0,cur='engine';
let rY=0.52,rX=0.48,zm=1.6,drag=null;
let rpm=0,spd=0,tmp=20;
const PI=Math.PI,sin=Math.sin,cos=Math.cos,abs=Math.abs,min=Math.min,max=Math.max;

function resize(){
  const r=devicePixelRatio||1;
  W=C.parentElement.clientWidth;H=C.parentElement.clientHeight;
  C.width=W*r;C.height=H*r;C.style.width=W+'px';C.style.height=H+'px';
  X.setTransform(r,0,0,r,0,0);mx=W/2;my=H/2;
}
addEventListener('resize',resize);resize();

// ============ 3D MATH ============
// Full 3D->2D with rotation
function proj(x,y,z){
  // rotate around Y axis
  let x1=x*cos(rY)-z*sin(rY), z1=x*sin(rY)+z*cos(rY);
  // rotate around X axis
  let y1=y*cos(rX)-z1*sin(rX), z2=y*sin(rX)+z1*cos(rX);
  // isometric projection with slight perspective
  const persp=800;
  const scale=persp/(persp+z2)*zm;
  return{x:mx+x1*scale,y:my+y1*scale,z:z2,s:scale};
}
function p3(x,y,z){const p=proj(x,y,z);return[p.x,p.y]}

// Depth sort helper
let drawCalls=[];
function addDraw(zVal,sys,fn){
  drawCalls.push({z:zVal,sys,fn});
}
function flushDraws(){
  drawCalls.sort((a,b)=>a.z-b.z);
  drawCalls.forEach(d=>d.fn());
  drawCalls=[];
}

// ============ LIGHTING MODEL ============
const lightDir={x:-.4,y:-.7,z:.5};
(function normLight(){
  const l=Math.sqrt(lightDir.x**2+lightDir.y**2+lightDir.z**2);
  lightDir.x/=l;lightDir.y/=l;lightDir.z/=l;
})();

function shade(baseColor,nx,ny,nz){
  const dot=max(0,nx*lightDir.x+ny*lightDir.y+nz*lightDir.z);
  const ambient=.25,diffuse=.6,spec=.15;
  const brightness=ambient+diffuse*dot+spec*Math.pow(dot,8);
  const r=parseInt(baseColor.slice(1,3),16);
  const g=parseInt(baseColor.slice(3,5),16);
  const b=parseInt(baseColor.slice(5,7),16);
  return`rgb(${min(255,r*brightness|0)},${min(255,g*brightness|0)},${min(255,b*brightness|0)})`;
}

function rgba(hex,a){
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return`rgba(${r},${g},${b},${a})`;
}

// ============ EXPLODE ============
function eo(sys){
  if(!expl)return[0,0,0];
  const d=120;
  const m={
    engine:[0,d*.6,0],fuel:[d,0,d*.3],intake:[-d*.5,d*.8,0],
    trans:[0,0,d],drive:[0,-d*.5,d*.5],susp:[0,-d,0],
    steer:[-d*.7,-d*.3,0],brake:[d*.4,-d*.6,0],cool:[-d,d*.4,0],
    oil:[d*.3,d*.5,d*.3],elec:[0,d*1.2,0],exh:[d*.8,0,-d*.3],
    body:[0,d*1.5,0]
  };
  return m[sys]||[0,0,0];
}

// ============ SHAPE BUILDERS ============
// Draw a proper 3D box with 6 lit faces
function box3d(ox,oy,oz,w,h,d,color,sys,label){
  const isA=sys===cur;
  const al=xray?(isA?.75:.06):(isA?.95:.35);
  const e=eo(sys);
  const cx=ox+e[0],cy=oy+e[1],cz=oz+e[2];

  // 8 vertices
  const v=[
    [cx-w/2,cy-h/2,cz-d/2],[cx+w/2,cy-h/2,cz-d/2],
    [cx+w/2,cy+h/2,cz-d/2],[cx-w/2,cy+h/2,cz-d/2],
    [cx-w/2,cy-h/2,cz+d/2],[cx+w/2,cy-h/2,cz+d/2],
    [cx+w/2,cy+h/2,cz+d/2],[cx-w/2,cy+h/2,cz+d/2]
  ];
  const p=v.map(q=>proj(q[0],q[1],q[2]));

  // 6 faces: [indices, normal]
  const faces=[
    [[4,5,6,7],[0,0,1]],  // front +z
    [[0,1,2,3],[0,0,-1]], // back -z
    [[1,5,6,2],[1,0,0]],  // right +x
    [[0,4,7,3],[-1,0,0]], // left -x
    [[0,1,5,4],[0,-1,0]], // top -y
    [[3,2,6,7],[0,1,0]]   // bottom +y
  ];

  // Sort faces by average z (painter's)
  const sf=faces.map(f=>{
    const avgZ=f[0].reduce((s,i)=>s+p[i].z,0)/4;
    return{idx:f[0],n:f[1],avgZ};
  }).sort((a,b)=>a.avgZ-b.avgZ);

  const zAvg=v.reduce((s,q)=>s+q[2],0)/8;
  addDraw(proj(cx,cy,cz).z,sys,()=>{
    sf.forEach(face=>{
      const col=shade(color,face.n[0],face.n[1],face.n[2]);
      X.beginPath();
      face.idx.forEach((i,j)=>{
        j===0?X.moveTo(p[i].x,p[i].y):X.lineTo(p[i].x,p[i].y);
      });
      X.closePath();
      X.globalAlpha=al;
      X.fillStyle=col;
      X.fill();
      if(isA){
        X.strokeStyle=rgba('#c7d2fe',.5);
        X.lineWidth=1;
        X.stroke();
      }
    });
    if(isA&&label){
      const cp=proj(cx,cy-h/2-8,cz);
      X.globalAlpha=1;
      X.fillStyle='#fff';
      X.font='bold 10px system-ui';
      X.textAlign='center';
      X.shadowColor=rgba(color,.6);
      X.shadowBlur=8;
      X.fillText(label,cp.x,cp.y);
      X.shadowBlur=0;
    }
    X.globalAlpha=1;
  });
}

// Proper 3D cylinder with lit surface
function cyl3d(ox,oy,oz,r,h,color,sys,label,axis){
  axis=axis||'y'; // axis along which cylinder extends
  const isA=sys===cur;
  const al=xray?(isA?.7:.06):(isA?.9:.35);
  const e=eo(sys);
  const cx=ox+e[0],cy=oy+e[1],cz=oz+e[2];
  const seg=20;

  const zAvg=proj(cx,cy,cz).z;
  addDraw(zAvg,sys,()=>{
    X.globalAlpha=al;

    // Generate ring points
    function ring(offset){
      const pts=[];
      for(let i=0;i<=seg;i++){
        const a=(i/seg)*PI*2;
        let px,py,pz;
        if(axis==='y'){
          px=cx+cos(a)*r; py=cy+offset; pz=cz+sin(a)*r;
        }else if(axis==='x'){
          px=cx+offset; py=cy+cos(a)*r; pz=cz+sin(a)*r;
        }else{
          px=cx+cos(a)*r; py=cy+sin(a)*r; pz=cz+offset;
        }
        pts.push(proj(px,py,pz));
      }
      return pts;
    }

    const top=ring(-h/2),bot=ring(h/2);

    // Side surface with gradient
    for(let i=0;i<seg;i++){
      const a=(i/seg)*PI*2;
      let nx,ny,nz;
      if(axis==='y'){nx=cos(a);ny=0;nz=sin(a);}
      else if(axis==='x'){nx=0;ny=cos(a);nz=sin(a);}
      else{nx=cos(a);ny=sin(a);nz=0;}

      const col=shade(color,nx,ny,nz);
      X.beginPath();
      X.moveTo(top[i].x,top[i].y);
      X.lineTo(top[i+1].x,top[i+1].y);
      X.lineTo(bot[i+1].x,bot[i+1].y);
      X.lineTo(bot[i].x,bot[i].y);
      X.closePath();
      X.fillStyle=col;
      X.fill();
    }

    // Top cap
    X.beginPath();
    top.forEach((p,i)=>i===0?X.moveTo(p.x,p.y):X.lineTo(p.x,p.y));
    X.closePath();
    let tn;
    if(axis==='y')tn=[0,-1,0];else if(axis==='x')tn=[-1,0,0];else tn=[0,0,1];
    X.fillStyle=shade(color,...tn);
    X.fill();

    if(isA){
      X.strokeStyle=rgba('#c7d2fe',.4);
      X.lineWidth=.8;
      X.stroke();
    }

    // Bottom cap
    X.beginPath();
    bot.forEach((p,i)=>i===0?X.moveTo(p.x,p.y):X.lineTo(p.x,p.y));
    X.closePath();
    if(axis==='y')tn=[0,1,0];else if(axis==='x')tn=[1,0,0];else tn=[0,0,-1];
    X.fillStyle=shade(color,...tn);
    X.fill();

    if(isA&&label){
      let lp;
      if(axis==='y')lp=proj(cx,cy-h/2-10,cz);
      else if(axis==='x')lp=proj(cx-h/2-10,cy,cz);
      else lp=proj(cx,cy,cz+h/2+10);
      X.globalAlpha=1;
      X.fillStyle='#fff';
      X.font='bold 9px system-ui';
      X.textAlign='center';
      X.shadowColor=rgba(color,.5);X.shadowBlur=6;
      X.fillText(label,lp.x,lp.y);
      X.shadowBlur=0;
    }
    X.globalAlpha=1;
  });
}

// 3D pipe with flow animation and proper thickness
function pipe3d(pts,color,sys,w,showFlow){
  const isA=sys===cur;
  const al=xray?(isA?.8:.05):(isA?.9:.25);
  const e=eo(sys);
  if(pts.length<2)return;
  const ep=pts.map(p=>[p[0]+e[0],p[1]+e[1],p[2]+e[2]]);
  const pp=ep.map(p=>proj(p[0],p[1],p[2]));
  const avgZ=pp.reduce((s,p)=>s+p.z,0)/pp.length;

  addDraw(avgZ,sys,()=>{
    X.globalAlpha=al;
    X.beginPath();
    pp.forEach((p,i)=>i===0?X.moveTo(p.x,p.y):X.lineTo(p.x,p.y));
    X.strokeStyle=isA?color:rgba(color,.6);
    X.lineWidth=(w||3)*(isA?2.2:1)*zm*.6;
    X.lineCap='round';X.lineJoin='round';
    if(isA){X.shadowColor=rgba(color,.4);X.shadowBlur=8;}
    X.stroke();
    X.shadowBlur=0;

    // Thinner highlight line on top
    if(isA){
      X.beginPath();
      pp.forEach((p,i)=>i===0?X.moveTo(p.x,p.y):X.lineTo(p.x,p.y));
      X.strokeStyle=rgba('#ffffff',.2);
      X.lineWidth=(w||3)*zm*.3;
      X.stroke();
    }

    // Animated flow particles
    if(isA&&run&&showFlow!==false){
      const len=ep.length-1;
      for(let d=0;d<4;d++){
        const ft=((t*1.5+d*.25)%1);
        const idx=ft*len|0;
        const fr=ft*len-idx;
        if(idx<len){
          const fx=ep[idx][0]+(ep[idx+1][0]-ep[idx][0])*fr;
          const fy=ep[idx][1]+(ep[idx+1][1]-ep[idx][1])*fr;
          const fz=ep[idx][2]+(ep[idx+1][2]-ep[idx][2])*fr;
          const fp=proj(fx,fy,fz);
          X.globalAlpha=.9;
          X.beginPath();
          X.arc(fp.x,fp.y,3*zm*.6,0,PI*2);
          X.fillStyle='#fff';
          X.shadowColor=color;X.shadowBlur=10;
          X.fill();
          X.shadowBlur=0;
        }
      }
    }
    X.globalAlpha=1;
  });
}

// Sphere approximation
function sphere3d(ox,oy,oz,r,color,sys,label){
  const isA=sys===cur;
  const al=xray?(isA?.7:.06):(isA?.85:.3);
  const e=eo(sys);
  const cx=ox+e[0],cy=oy+e[1],cz=oz+e[2];
  const p=proj(cx,cy,cz);

  addDraw(p.z,sys,()=>{
    X.globalAlpha=al;
    const sr=r*p.s;
    const g=X.createRadialGradient(p.x-sr*.3,p.y-sr*.3,sr*.1,p.x,p.y,sr);
    const rc=parseInt(color.slice(1,3),16),gc=parseInt(color.slice(3,5),16),bc=parseInt(color.slice(5,7),16);
    g.addColorStop(0,`rgba(${min(255,rc+80)},${min(255,gc+80)},${min(255,bc+80)},1)`);
    g.addColorStop(.5,color);
    g.addColorStop(1,`rgba(${rc*.4|0},${gc*.4|0},${bc*.4|0},1)`);
    X.beginPath();X.arc(p.x,p.y,sr,0,PI*2);
    X.fillStyle=g;X.fill();
    if(isA){X.strokeStyle=rgba('#c7d2fe',.5);X.lineWidth=1;X.stroke();}

    if(isA&&label){
      X.globalAlpha=1;
      X.fillStyle='#fff';X.font='bold 9px system-ui';X.textAlign='center';
      X.shadowColor=rgba(color,.5);X.shadowBlur=6;
      X.fillText(label,p.x,p.y-sr-6);
      X.shadowBlur=0;
    }
    X.globalAlpha=1;
  });
}

// 3D Wheel (torus-like)
function wheel3d(ox,oy,oz,R,sys){
  const isA=sys===cur||cur==='brake';
  const al=xray?(isA?.6:.08):(isA?.9:.5);
  const e=eo(sys);
  const cx=ox+e[0],cy=oy+e[1],cz=oz+e[2];
  const p=proj(cx,cy,cz);

  addDraw(p.z,sys,()=>{
    X.globalAlpha=al;
    const seg=24;
    const tireW=R*.35;

    // Tire - draw as thick ellipse
    const pts=[];
    for(let i=0;i<=seg;i++){
      const a=(i/seg)*PI*2+(run?t*4:0)*.0;
      const px=cx,py=cy+cos(a)*R,pz=cz+sin(a)*R;
      pts.push(proj(px,py,pz));
    }

    // Filled tire shape
    X.beginPath();
    pts.forEach((pt,i)=>i===0?X.moveTo(pt.x,pt.y):X.lineTo(pt.x,pt.y));
    X.closePath();
    const g=X.createRadialGradient(p.x,p.y,R*p.s*.2,p.x,p.y,R*p.s);
    g.addColorStop(0,'#3a3a4a');
    g.addColorStop(.6,'#1a1a2a');
    g.addColorStop(1,'#0a0a15');
    X.fillStyle=g;
    X.fill();
    X.strokeStyle='rgba(60,60,80,.6)';
    X.lineWidth=2;
    X.stroke();

    // Hub/rim
    const hub=[];
    for(let i=0;i<=seg;i++){
      const a=(i/seg)*PI*2;
      const py=cy+cos(a)*R*.45,pz=cz+sin(a)*R*.45;
      hub.push(proj(cx,py,pz));
    }
    X.beginPath();
    hub.forEach((pt,i)=>i===0?X.moveTo(pt.x,pt.y):X.lineTo(pt.x,pt.y));
    X.closePath();
    const hg=X.createRadialGradient(p.x-R*p.s*.1,p.y-R*p.s*.1,2,p.x,p.y,R*p.s*.45);
    hg.addColorStop(0,'#b0b0c0');
    hg.addColorStop(.5,'#707080');
    hg.addColorStop(1,'#404050');
    X.fillStyle=hg;
    X.fill();

    // Spokes
    const spokeAng=run?t*6:0;
    for(let i=0;i<5;i++){
      const a=spokeAng+(i/5)*PI*2;
      const ip=proj(cx,cy+cos(a)*R*.1,cz+sin(a)*R*.1);
      const op=proj(cx,cy+cos(a)*R*.4,cz+sin(a)*R*.4);
      X.beginPath();X.moveTo(ip.x,ip.y);X.lineTo(op.x,op.y);
      X.strokeStyle='rgba(180,180,200,.7)';X.lineWidth=2.5*zm*.6;
      X.stroke();
    }

    // Center cap
    X.beginPath();X.arc(p.x,p.y,R*p.s*.12,0,PI*2);
    X.fillStyle='#555565';X.fill();

    // Brake disc (visible behind wheel)
    if(cur==='brake'){
      const bd=[];
      for(let i=0;i<=seg;i++){
        const a=(i/seg)*PI*2;
        const py=cy+cos(a)*R*.55,pz=cz+sin(a)*R*.55;
        bd.push(proj(cx+(ox<0?-3:3),py,pz));
      }
      X.globalAlpha=.7;
      X.beginPath();
      bd.forEach((pt,i)=>i===0?X.moveTo(pt.x,pt.y):X.lineTo(pt.x,pt.y));
      X.closePath();
      X.fillStyle='rgba(244,63,94,.4)';X.fill();
      X.strokeStyle='rgba(244,63,94,.6)';X.lineWidth=1.5;X.stroke();

      // Caliper
      const cp=proj(cx+(ox<0?-5:5),cy+R*.45,cz);
      X.beginPath();X.arc(cp.x,cp.y,6*zm*.6,0,PI*2);
      X.fillStyle='rgba(244,63,94,.8)';X.fill();
      X.fillStyle='#fff';X.font='bold 7px system-ui';X.textAlign='center';
      X.fillText('Суппорт',cp.x,cp.y-10);
    }

    X.globalAlpha=1;
  });
}

// ============ SUSPENSION ============
function drawSusp(){
  const b=run?sin(t*3.5)*2:0;
  // Front MacPherson struts
  for(let s of[-1,1]){
    const sz=s*55;
    // Strut body
    cyl3d(-110,-5+b,sz, 5,35, '#10b981','susp',s<0?'Стойка McPherson':'','y');
    // Spring (coils)
    const e2=eo('susp');
    for(let i=0;i<8;i++){
      const a1=(i/8)*PI*2;
      const a2=((i+1)/8)*PI*2;
      const y1=-20+b+i*3.5;
      const y2=-20+b+(i+1)*3.5;
      const p1=proj(-110+cos(a1)*7+e2[0],y1+e2[1],sz+sin(a1)*3+e2[2]);
      const p2=proj(-110+cos(a2)*7+e2[0],y2+e2[1],sz+sin(a2)*3+e2[2]);
      addDraw((p1.z+p2.z)/2,'susp',()=>{
        X.globalAlpha=cur==='susp'?.9:.3;
        X.beginPath();X.moveTo(p1.x,p1.y);X.lineTo(p2.x,p2.y);
        X.strokeStyle='#34d399';X.lineWidth=2.5;X.lineCap='round';X.stroke();
        X.globalAlpha=1;
      });
    }
    // Lower arm
    pipe3d([[-110,18+b,sz],[-95,20,sz*.6],[-80,20,sz*.3]],
      '#059669','susp',2.5,false);
    pipe3d([[-110,18+b,sz],[-125,20,sz*.6],[-135,20,sz*.3]],
      '#059669','susp',2.5,false);
  }

  // Rear multilink
  for(let s of[-1,1]){
    const sz=s*55;
    cyl3d(125,-3-b,sz, 4,30, '#10b981','susp',s<0?'Многорычажная':'','y');
    // Springs
    const e2=eo('susp');
    for(let i=0;i<7;i++){
      const a1=(i/7)*PI*2;
      const a2=((i+1)/7)*PI*2;
      const y1=-16-b+i*3.2;
      const y2=-16-b+(i+1)*3.2;
      const p1=proj(125+cos(a1)*6+e2[0],y1+e2[1],sz+sin(a1)*2.5+e2[2]);
      const p2=proj(125+cos(a2)*6+e2[0],y2+e2[1],sz+sin(a2)*2.5+e2[2]);
      addDraw((p1.z+p2.z)/2,'susp',()=>{
        X.globalAlpha=cur==='susp'?.9:.3;
        X.beginPath();X.moveTo(p1.x,p1.y);X.lineTo(p2.x,p2.y);
        X.strokeStyle='#34d399';X.lineWidth=2;X.lineCap='round';X.stroke();
        X.globalAlpha=1;
      });
    }
    // 3 control arms per side
    pipe3d([[125,20-b,sz],[115,22,sz*.5]],
      '#059669','susp',2,false);
    pipe3d([[125,20-b,sz],[135,22,sz*.6]],
      '#059669','susp',2,false);
    pipe3d([[125,14-b,sz],[118,16,sz*.4]],
      '#047857','susp',1.8,false);
  }

  // Anti-roll bars
  pipe3d([[-110,18+b,-45],[-110,20,-20],[-110,20,20],[-110,18+b,45]],
    '#6ee7b7','susp',2,false);
  pipe3d([[125,18-b,-42],[125,20,-15],[125,20,15],[125,18-b,42]],
    '#6ee7b7','susp',2,false);
}

    const blink=sin(t*8)>.2;
    if(blink){
      const sensors=[
        [-115,-5,0,'Детонация'],[-135,0,-15,'MAF'],
        [-110,18,55,'ABS FL'],[125,18,55,'ABS RL'],
        [-118,-3,5,'Темп ОЖ'],[-100,20,18,'Давл. масла'],
        [-108,-24,-15,'Лямбда'],[95,18,0,'Уровень топл.']
      ];
      sensors.forEach(s=>{
        const e2=eo('elec');
        const p=proj(s[0]+e2[0],s[1]+e2[1],s[2]+e2[2]);
        addDraw(p.z+100,'elec',()=>{
          X.globalAlpha=.9;
          X.beginPath();X.arc(p.x,p.y,4*zm*.6,0,PI*2);
          X.fillStyle='#fde047';
          X.shadowColor='#fde047';X.shadowBlur=12;
          X.fill();X.shadowBlur=0;
          X.fillStyle='#fff';X.font='bold 8px system-ui';X.textAlign='center';
          X.fillText(s[3],p.x,p.y-8);
          X.globalAlpha=1;
        });
      });
    }
  }
}

// ============ EXHAUST ============
function drawExhaust(){
  // Exhaust manifold runners
  for(let i=0;i<4;i++){
    pipe3d([[-125+i*12,15,20],[-120+i*8,18,25],[-110,20,28]],
      '#78716c','exh',2,false);
  }
  // Turbo (exhaust side)
  cyl3d(-108,20,30, 10,12, '#57534e','exh','Турбина','z');

  // Downpipe
  pipe3d([[-108,20,35],[-95,22,35],[-75,24,32],[-55,25,28]],
    '#78716c','exh',3.5);
  // Catalytic converter
  box3d(-50,24,28, 22,12,10, '#a8a29e','exh','Катализатор');
  // GPF
  box3d(-22,24,28, 16,10,10, '#d6d3d1','exh','GPF');
  // Mid pipe
  pipe3d([[-14,24,28],[10,24,26],[35,24,24],[55,24,22]],
    '#78716c','exh',3);
  // Resonator
  box3d(55,24,22, 20,10,10, '#57534e','exh','Резонатор');
  // Rear muffler
  box3d(100,24,20, 35,14,16, '#44403c','exh','Глушитель');
  // Tips
  cyl3d(120,24,28, 4,8, '#a8a29e','exh','','z');
  cyl3d(120,24,15, 4,8, '#a8a29e','exh','Патрубки','z');
  // Sport valve
  sphere3d(98,24,25, 3,'#eab308','exh','Клапан');
  // Lambda sensors
  sphere3d(-48,18,30, 3,'#eab308','exh','O2 #1');
  sphere3d(-14,18,30, 3,'#eab308','exh','O2 #2');

  // Exhaust gas particles
  if(run){
    const e2=eo('exh');
    for(let i=0;i<6;i++){
      const ft=(t*2+i*.15)%1;
      const p=proj(128+ft*25+e2[0],24+sin(ft*6)*3+e2[1],22+ft*12+e2[2]);
      addDraw(p.z+50,'exh',()=>{
        X.globalAlpha=(.5-ft*.4)*(cur==='exh'?1:.3);
        X.beginPath();X.arc(p.x,p.y,(3-ft*2)*zm*.5,0,PI*2);
        X.fillStyle='#9ca3af';X.fill();
        X.globalAlpha=1;
      });
    }
  }
}

// ============ WHEELS ============
function drawWheels(){
  const b=run?sin(t*3.5)*2:0;
  wheel3d(-110,18+b,62, 22,'susp');
  wheel3d(-110,18+b,-62, 22,'susp');
  wheel3d(125,18-b,62, 22,'susp');
  wheel3d(125,18-b,-62, 22,'susp');
}

// ============ GROUND & EFFECTS ============
function drawGround(){
  const c=proj(0,35,0);
  const g=X.createRadialGradient(c.x,c.y,20,c.x,c.y,350);
  g.addColorStop(0,'rgba(99,102,241,.06)');
  g.addColorStop(.5,'rgba(99,102,241,.02)');
  g.addColorStop(1,'rgba(0,0,0,0)');
  X.fillStyle=g;
  X.fillRect(0,0,W,H);

  // Grid lines
  X.globalAlpha=.04;
  const step=50;
  for(let i=-8;i<=8;i++){
    const p1=p3(i*step,30,-400),p2=p3(i*step,30,400);
    X.beginPath();X.moveTo(p1[0],p1[1]);X.lineTo(p2[0],p2[1]);
    X.strokeStyle='#6366f1';X.lineWidth=.5;X.stroke();
    const p3a=p3(-400,30,i*step),p4=p3(400,30,i*step);
    X.beginPath();X.moveTo(p3a[0],p3a[1]);X.lineTo(p4[0],p4[1]);
    X.stroke();
  }
  X.globalAlpha=1;
}

function drawGlow(){
  if(!run)return;
  const colors={
    engine:'239,68,68',cool:'6,182,212',exh:'120,113,108',
    elec:'234,179,8',fuel:'245,158,11',intake:'167,139,250'
  };
  if(colors[cur]){
    const e2=eo(cur);
    let gx=0,gy=0;
    if(cur==='engine'){gx=-110;gy=-10;}
    else if(cur==='cool'){gx=-150;gy=0;}
    else if(cur==='exh'){gx=50;gy=24;}
    else if(cur==='elec'){gx=-40;gy=-10;}
    else if(cur==='fuel'){gx=0;gy=10;}
    else if(cur==='intake'){gx=-130;gy=-5;}
    const p=proj(gx+e2[0],gy+e2[1],e2[2]);
    const g=X.createRadialGradient(p.x,p.y,5,p.x,p.y,80);
    g.addColorStop(0,`rgba(${colors[cur]},.12)`);
    g.addColorStop(1,`rgba(${colors[cur]},0)`);
    X.fillStyle=g;
    X.fillRect(p.x-100,p.y-100,200,200);
  }
}

  intake:{n:'Система наддува',d:'Twin-scroll турбина + интеркулер',s:[['Турбина','Twin-scroll'],['Давление','1.2 бар'],['Интеркулер','Воздух-воздух'],['Дроссель','Электронный'],['BOV','Рециркулир.'],['Wastegate','Электронный']]},

  elec:{n:'Электросистема',d:'12V + 48V mild-hybrid BSG',s:[['АКБ','80Ah AGM'],['BSG','48V 12кВт'],['Шина','CAN-FD + LIN'],['ЭБУ','Bosch MED17'],['Датчики','> 80 шт'],['Провода','~ 2.5 км']]},

function sel(s){
  cur=s;
  document.querySelectorAll('.sbtn').forEach(b=>b.classList.toggle('act',b.dataset.s===s));
  const i=info[s];
  if(i){
    let h=`<strong>${i.n}</strong><div class="desc">${i.d}</div>`;
    i.s.forEach(r=>h+=`<div class="sr"><span>${r[0]}</span><span class="sv">${r[1]}</span></div>`);
    document.getElementById('si').innerHTML=h;
  }
}

// ============ CONTROLS ============
function togRun(){run=!run;document.getElementById('btnRun').classList.toggle('on',run);}
function togExp(){expl=!expl;document.getElementById('btnExp').classList.toggle('on',expl);}
function togXr(){xray=!xray;document.getElementById('btnXr').classList.toggle('on',xray);}
function reset(){rY=.52;rX=.48;zm=1.6;expl=0;xray=0;
  document.getElementById('btnExp').classList.remove('on');
  document.getElementById('btnXr').classList.remove('on');
}

// Mouse
C.addEventListener('mousedown',e=>{drag={x:e.clientX,y:e.clientY,ry:rY,rx:rX};});
addEventListener('mousemove',e=>{
  if(!drag)return;
  rY=drag.ry+(e.clientX-drag.x)*.006;
  rX=max(-.8,min(.8,drag.rx+(e.clientY-drag.y)*.006));
});
addEventListener('mouseup',()=>{drag=null;});
C.addEventListener('wheel',e=>{e.preventDefault();zm=max(.5,min(4,zm-e.deltaY*.002));},{passive:false});

// Touch
let tch=null;
C.addEventListener('touchstart',e=>{if(e.touches.length===1){const t2=e.touches[0];tch={x:t2.clientX,y:t2.clientY,ry:rY,rx:rX};}});
C.addEventListener('touchmove',e=>{e.preventDefault();if(tch&&e.touches.length===1){const t2=e.touches[0];rY=tch.ry+(t2.clientX-tch.x)*.006;rX=max(-.8,min(.8,tch.rx+(t2.clientY-tch.y)*.006));}},{passive:false});
C.addEventListener('touchend',()=>{tch=null;});

// ============ MAIN LOOP ============
function update(){
  if(run){rpm+=(3200-rpm)*.02;tmp+=(92-tmp)*.005;spd+=(120-spd)*.01;}
  else{rpm*=.98;tmp+=(20-tmp)*.002;spd*=.97;}
  document.getElementById('vRpm').textContent=rpm|0;
  document.getElementById('vSpd').textContent=spd|0;
  document.getElementById('vTmp').textContent=tmp|0;
}

function frame(){
  t+=.016;
  update();

  X.clearRect(0,0,W,H);
  // BG
  const bg=X.createLinearGradient(0,0,W*.3,H);
  bg.addColorStop(0,'#0c1220');bg.addColorStop(1,'#080c14');
  X.fillStyle=bg;X.fillRect(0,0,W,H);

  drawGround();

  // Build all draw calls
  drawBody();
  drawEngine();
  drawIntake();
  drawFuel();
  drawOil();
  drawCool();
  drawTrans();
  drawDrive();
  drawSusp();
  drawSteer();
  drawBrakes();
  drawExhaust();
  drawElec();
  drawWheels();

  // Sort and render
  flushDraws();
  drawGlow();

  requestAnimationFrame(frame);
}

sel('engine');
requestAnimationFrame(frame);
</script>
